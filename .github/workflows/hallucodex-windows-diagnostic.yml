name: Diagnose Windows installer
on:
  push:
    branches: [diagnose/windows-installer-0111]
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile installer and show compiler output
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'hallucodex-installer'
          & ./apps/desktop/scripts/prepare-windows-installer.ps1 -OutputDirectory $output -CompileProgressOnly
